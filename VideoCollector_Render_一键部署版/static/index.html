<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Video Collector</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101317;color:#f4f7fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:auto;padding:24px 16px 50px}
h1{font-size:28px;margin:0 0 8px}
.sub{color:#96a0aa;line-height:1.7;margin-bottom:18px}
.card{background:#181d23;border:1px solid #2a323b;border-radius:18px;padding:16px;margin-bottom:14px}
textarea{width:100%;height:150px;border:1px solid #36414c;border-radius:14px;background:#0f1317;color:#fff;padding:14px;font-size:16px;resize:vertical}
button,.btn{border:0;border-radius:12px;min-height:48px;padding:0 16px;font-size:16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.primary{width:100%;background:white;color:#111;margin-top:12px;cursor:pointer}
.primary:disabled{opacity:.55}
.muted{color:#89949f;font-size:13px;line-height:1.6}
.hidden{display:none}
.err{color:#ff9191;white-space:pre-wrap;line-height:1.7}
.ok{color:#a8e6b0}
.cover{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:14px;background:#0b0e11}
.title{font-size:19px;font-weight:700;line-height:1.45;margin:12px 0 5px}
.meta{color:#a5afb9;font-size:14px;line-height:1.65}
.row{border-top:1px solid #2b333c;padding:11px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.link{background:#29313a;color:white}
.badge{display:inline-block;padding:5px 9px;background:#242c34;border-radius:20px;margin:4px 4px 0 0;color:#aeb8c2;font-size:12px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Video Collector</h1>
  <div class="sub">粘贴视频分享链接或完整分享文案，云端解析公开可访问的视频信息。</div>

  <section class="card">
    <textarea id="txt" placeholder="粘贴抖音 / 小红书 / 快手 / B站等分享链接或分享文案"></textarea>
    <button id="go" class="primary">开始解析</button>
    <div style="margin-top:12px">
      <span class="badge">抖音</span>
      <span class="badge">小红书</span>
      <span class="badge">快手</span>
      <span class="badge">B站</span>
      <span class="badge">视频号*</span>
    </div>
    <div class="muted" style="margin-top:10px">* 各平台可能因登录、验证码、DRM 或访问限制导致部分链接无法解析。</div>
  </section>

  <section id="status" class="card hidden"></section>
  <section id="result" class="card hidden"></section>
</main>

<script>
const txt=document.getElementById('txt');
const go=document.getElementById('go');
const status=document.getElementById('status');
const result=document.getElementById('result');

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function showStatus(msg,cls=''){
  status.className='card '+cls;
  status.textContent=msg;
}
function hideStatus(){status.className='card hidden';}

go.onclick=async()=>{
  const text=txt.value.trim();
  if(!text){showStatus('请先粘贴分享链接或分享文案。','err');return;}
  go.disabled=true;
  result.className='card hidden';
  showStatus('正在云端解析，请等待……');

  try{
    const r=await fetch('/api/parse',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    });
    const j=await r.json();

    if(!j.success){
      showStatus(j.error||'解析失败','err');
      return;
    }

    hideStatus();
    const d=j.data||{};
    const rows=(d.videos||[]).slice(0,5).map(f=>`
      <div class="row">
        <div>
          <div>${esc(f.quality||'视频源')}</div>
          <div class="muted">${esc(f.ext||'')}${f.width&&f.height?' · '+f.width+'×'+f.height:''}</div>
        </div>
        <a class="btn link" href="${esc(f.url)}" target="_blank" rel="noopener">打开视频</a>
      </div>
    `).join('');

    result.innerHTML=`
      ${d.cover?`<img class="cover" src="${esc(d.cover)}" alt="">`:''}
      <div class="title">${esc(d.title||'未命名视频')}</div>
      <div class="meta">
        ${d.author?'作者：'+esc(d.author)+'<br>':''}
        ${d.platform?'平台：'+esc(d.platform)+'<br>':''}
        ${d.duration?'时长：'+Math.round(d.duration)+' 秒':''}
      </div>
      <div style="margin-top:12px">${rows||'<div class="muted">已获取视频信息，但没有可直接打开的视频媒体地址。</div>'}</div>
    `;
    result.className='card';
  }catch(e){
    showStatus('网络请求失败：'+e.message,'err');
  }finally{
    go.disabled=false;
  }
};
</script>
</body>
</html>
